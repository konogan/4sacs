name: Deploy 4sacs.fr to Freebox (tar optimized)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create tar archive
        run: |
          echo "Création de l'archive tar.gz..."
          tar -czf site_static.tar.gz -C site_static .

      - name: Upload archive via SCP to Freebox tmp
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 2222
          source: "site_static.tar.gz"
          target: "/home/freebox/tmp"
          overwrite: true
          rm: false
          debug: true

      - name: Deploy and restart Nginx
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 2222
          script: |
            echo "Nettoyage du dossier html..."
            sudo rm -rf /opt/docker/sacs/html
            sudo mkdir -p /opt/docker/sacs/html
            sudo chown -R $USER:$USER /opt/docker/sacs/html
            sudo chmod -R 755 /opt/docker/sacs/html

            echo "Extraction de l'archive..."
            tar -xzf /home/freebox/tmp/site_static.tar.gz -C /opt/docker/sacs/html
            rm /home/freebox/tmp/site_static.tar.gz

            echo "Redémarrage du conteneur Nginx (sacs)..."
            cd /opt/docker/sacs
            docker compose restart sacs